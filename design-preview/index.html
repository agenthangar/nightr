const updateStatuses={

function generalSettings(){

function sampleUpdateStatus(){
  const {nextVersion,phase}=updateSample;
  const ready=phase==='ready';
  return `${statusValue(updateStatuses[phase],ready||phase==='current')}${ready?`<small class="ds-hint">Version ${nextVersion}</small>`:''}`;
}

function renderUpdate(focusAction=false){
  const button=document.querySelector('[data-update-action]');
  if(!button)return;
  const {version,build,phase}=updateSample;
  const ready=phase==='ready';
  document.querySelector('.update-version').innerHTML=`${version}<small>Build ${build}</small>`;
  document.querySelector('.update-status').innerHTML=sampleUpdateStatus();
  button.dataset.updateAction=ready?'install':'check';
  button.textContent=ready?'Install Update…':'Check for Updates';
  button.classList.toggle('primary',ready);
  button.disabled=['checking','downloading'].includes(phase);
  if(focusAction && document.activeElement===document.body)button.focus();
}

function updateFixture(result){
  if(!['available','current','offline','unpublished','unverified'].includes(result))return;
  updateSample.check+=1;
  updateSample.result=result;
  updateSample.phase='idle';
  renderUpdate();
}

async function checkForSampleUpdate({background=false}={}){
  if((background && !S.settings.autoUpdates) || ['checking','downloading','ready'].includes(updateSample.phase))return;
  const check=++updateSample.check;
  const pause=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  updateSample.phase='checking';
  renderUpdate();
  await pause(240);
  if(check!==updateSample.check)return;
  if(updateSample.result==='available' && updateSample.version!==updateSample.nextVersion){
    updateSample.phase='downloading';
    renderUpdate();
    await pause(480);
    if(check!==updateSample.check)return;
    updateSample.phase='ready';
  } else {
    updateSample.phase=updateSample.result==='available'?'current':updateSample.result;
  }
  renderUpdate(!background);
}

function installSampleUpdate(){
  const authorize=()=>modal(`Install Nightr ${updateSample.nextVersion}?`,
    '<p>Nightr will reopen after installation. Terminal will ask for administrator approval.</p>', [
      ['Cancel',closeModal],
      ['Simulate Install',()=>{
        closeModal();
        updateSample.version=updateSample.nextVersion;
        updateSample.build=updateSample.nextBuild;
        updateSample.phase='current';
        renderUpdate(true);
      },'primary']
    ]);
  const dirty=Object.keys(S.settings).some(key=>S.settings[key]!==U.settingsDraft[key]) ||
    Object.keys(U.pendingCredentials).length || Object.keys(U.securityDraft).length;
  if(!dirty){authorize();return;}
  modal('Save changes before updating?','<p>Updating will close Settings.</p>',[
    ['Keep Editing',closeModal],
    ['Discard and Continue',()=>{closeModal();appSettingsCancel({keepOpen:true});authorize();}],
    ['Save and Continue',()=>{closeModal();if(appSettingsSave({keepOpen:true}))authorize();},'primary']
  ]);
}

function bindUpdateAction(){
  const button=document.querySelector('[data-update-action]');
  if(button)button.onclick=()=>button.dataset.updateAction==='install'?installSampleUpdate():checkForSampleUpdate();
}

function networkScanStart(authorize=false){const c=U.networkChooser;if(!c)return null;if(networkScanTimer!==null)clearTimeout(networkScanTimer);const token=++networkGeneration;c.generation=token;c.scanning=true;c.scan={...c.scan,state:'scanning',complete:false,fresh:false};c.target=authorize&&['permission','denied','unavailable'].includes(U.wifiScenario)?(U.wifiScenario==='permission'?'complete':U.wifiScenario):(U.wifiScenario==='scanning'?'complete':U.wifiScenario);if(authorize&&U.wifiScenario==='permission')U.wifiScenario='complete';renderNetworkChooser();networkScanTimer=setTimeout(()=>networkScanComplete(token),1200);return token;}

function renderNetworkChooser(focus){const c=U.networkChooser;if(!c)return;const priorInput=$('network-demo-password'),old=document.activeElement,focusedValue=old?.dataset?.networkValue,focusedId=old?.id;let content;if(c.tab==='saved')content=networkRows(savedWifiOptions(c));else if(c.tab==='nearby'){const rows=c.scan.rows.map(row=>({ssid:row.ssid,meta:c.scan.complete&&c.scan.fresh&&row.ssid===c.scan.current?'Current Wi-Fi':(c.scan.fresh?'':'Last seen'+settingsSeparator())+row.rssi+' dBm'}));content=`<div class="network-tools"><span role="status">${networkStatus(c)}</span><button id="network-refresh" data-network-refresh ${c.scanning?'disabled':''}>Refresh</button>${['permission','denied'].includes(c.scan.state)?'<button id="network-enable" data-network-enable>Enable discovery</button>':''}</div>${rows.length?networkRows(rows):'<div class="network-message" aria-hidden="true"></div>'}`;}else content=`<div class="network-manual"><label for="network-manual">Network name</label><input id="network-manual" type="text" value="${esc(c.selected)}" autocomplete="off" spellcheck="false" aria-describedby="network-error"></div>`;const body=`<div class="network-chooser" data-theme="${U.theme}"><nav class="network-tabs" role="tablist" aria-label="Network source">${[['saved','Saved'],['nearby','Nearby'],['manual','Manual']].map(([id,label])=>`<button id="network-tab-${id}" role="tab" aria-controls="network-panel" aria-selected="${c.tab===id}" data-network-tab="${id}">${label}</button>`).join('')}</nav><div class="network-content" id="network-panel" role="tabpanel" aria-labelledby="network-tab-${c.tab}"><h3 class="chooser-heading">${{saved:'Saved networks',nearby:'Nearby networks',manual:'Network details'}[c.tab]}</h3>${content}<div id="network-credential-host"></div></div><div id="network-error" class="network-error" aria-live="polite">${esc(c.error)}</div></div>`;modal('Choose hotspot',body,[['Cancel',networkChooserClose],['Use network',networkUse,'primary']]);const buttons=$('mod OUR MAC. YOUR CONTROL.</span></div><section class="web-features" id="web-features"><div class="web-section-label">A QUIET COMPANION FOR LONG RUNS</div><div class="web-feature-grid"><article class="web-feature"><div class="index">01 / AWAKE, ON PURPOSE</div><h3>Keep the work going.</h3><p>One Start. One Stop. A clear menu bar tells you whether your Mac is awake, paused for battery, or recovering. Stop stays stopped after login or wake.</p></article><article class="web-feature"><div class="index">02 / KNOW WHEN TO PAUSE</div><h3>Protect the battery, too.</h3><p>Set a battery cutoff and inactivity grace. Safe power conditions take priority over recovery, and status separates what you asked for from what’s happening.</p></article><article class="web-feature"><div class="index">03 / A BOUNDED WAY BACK</div><h3>A fallback, with limits.</h3><p>Try a saved phone hotspot after an outage delay. A bounded number of joins, then lightweight internet checks keep watching. After network return or wake, Nightr verifies internet and restores its own protection when safe. Coding agents handle their own reconnections.</p></article></div></section><section class="web-cli" id="web-cli"><div><div class="web-section-label">SAME CONTROL. YOUR TERMINAL.</div><h3>A small command.<br>A clear answer.</h3><p>Use the app or a standalone CLI. Existing <span class="mono">nosleep</span> invocations remain compatible. Read status as JSON without changing a thing.</p><button class="link" style="font-size:12px;margin-top:16px" data-view="app">Try the interactive sample →</button></div><div class="web-code"><span class="cyan">$ nightr start</span><br><span class="green">● On</span> · protection active<br><br><span class="cyan">$ nightr status --json</span><br>{ "status": "${M.status(S)}",<br>  "enabled": ${S.enabled},<br>  "sample": true }<br><br><span style="color:#8b9699">$ nightr stop<br>○ Off · stays stopped</span></div></section><section class="web-install" id="web-install"><div><div class="web-section-label">DOWNLOAD. OPEN. GET TO WORK.</div><h3>A Mac app. Ready to open.</h3><p>Planned: a signed, notarized universal app for macOS 13+, with its runtime included. Download the DMG, drag Nightr to Applications, then authorize its power helper. No Xcode or separate Python installation. This preview has no release download yet.</p><p style="margin-top:12px">Nightr cannot keep work running through system sleep or turn on a phone hotspot remotely. Instant Hotspot is a separate macOS feature.</p></div><div><div class="web-code"># Planned release interface<br><span class="cyan">nightr start<br>nightr config<br>nightr status --json<br>nightr stop</span></div><div class="row wrap" style="margin-top:14px"><button class="primary small" data-external="install">Download for macOS ↗</button><button class="quiet small" data-external="source">View source ↗</button></div></div></section><footer class="web-footer"><span class="row">${icon(18)}<span>nightr · an AgentHangar tool</span></span><button class="link" style="font-size:10px" data-view="hangar">Explore AgentHangar →</button><span>MIT · proposed design</span></footer></div></div>`;}
