name: Signed macOS candidate
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Candidate patch version without v (for example 0.1.0); never publishes'
        required: true
        type: string
      resume_run_id:
        description: 'Earlier completed candidate run containing the same-source checkpoint; blank starts a build'
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: nightr-signed-candidate
  cancel-in-progress: false
jobs:
  candidate:
    # A dispatch from a branch or tag must never access release credentials.
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 90
    environment: release
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      NIGHTR_TEAM_ID: ${{ vars.NIGHTR_TEAM_ID }}
      NIGHTR_APPLICATION_IDENTITY: ${{ vars.NIGHTR_APPLICATION_IDENTITY }}
      NIGHTR_INSTALLER_IDENTITY: ${{ vars.NIGHTR_INSTALLER_IDENTITY }}
      NIGHTR_NOTARY_PROFILE: nightr-release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Initialize candidate acceptance evidence
        run: |
          mkdir -p dist
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('dist/installer-acceptance.json').write_text(json.dumps({
              'schemaVersion': 1, 'status': 'not_started', 'commit': os.environ['GITHUB_SHA'],
              'runID': os.environ['GITHUB_RUN_ID'],
              'reason': 'Build or earlier validation has not completed; see bounded Actions job logs.',
              'untested': ['helper/login authorization', 'version-changing update', 'reboot recovery']
          }, indent=2) + '\n')
          PY
      - name: Verify candidate version and genuine signing configuration
        env:
          VERSION: ${{ inputs.version }}
          CERTIFICATE: ${{ secrets.NIGHTR_SIGNING_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.NIGHTR_SIGNING_CERTIFICATE_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NIGHTR_NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NIGHTR_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NIGHTR_NOTARY_ISSUER_ID }}
        run: |
          python3 - <<'PY'
          import os,re
          assert re.fullmatch(r'0\.[0-9]+\.[0-9]+', os.environ['VERSION']), 'Invalid stable version'
          for key in ('NIGHTR_TEAM_ID','NIGHTR_APPLICATION_IDENTITY','NIGHTR_INSTALLER_IDENTITY','CERTIFICATE','CERTIFICATE_PASSWORD','NOTARY_KEY','NOTARY_KEY_ID','NOTARY_ISSUER'):
              assert os.environ.get(key), f'Missing genuine release signing configuration: {key}'
          PY
      - name: Verify exact dispatched main commit and toolchain
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          xcodebuild -version
          swift --version
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fetch and validate exact-source checkpoint provenance
        if: inputs.resume_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
          VERSION: ${{ inputs.version }}
        run: |
          python3 scripts/notary_checkpoint.py --fetch-run "$RESUME_RUN_ID" --version "$VERSION" --team-id "$NIGHTR_TEAM_ID" --output dist/checkpoint
      - name: Import ephemeral Developer ID identities
        env:
          CERTIFICATE: ${{ secrets.NIGHTR_SIGNING_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.NIGHTR_SIGNING_CERTIFICATE_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NIGHTR_NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NIGHTR_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NIGHTR_NOTARY_ISSUER_ID }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/nightr-signing.keychain-db"
          PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$PASSWORD"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          printf '%s' "$NOTARY_KEY" > "$RUNNER_TEMP/notary.p8"
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          security list-keychains -d user -s "$KEYCHAIN"
          security default-keychain -d user -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$PASSWORD" "$KEYCHAIN"
          xcrun notarytool store-credentials "$NIGHTR_NOTARY_PROFILE" --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" --keychain "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/notary.p8"
      - name: Validate safe unit and extraction contracts
        run: |
          python3 -m pip install -r requirements-dev.txt
          python3 -m pytest --cov --cov-fail-under=97
          swift test
      - name: Build, sign, notarize, staple and verify release
        env:
          VERSION: ${{ inputs.version }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
        run: |
          if test -n "$RESUME_RUN_ID"; then
            python3 scripts/build_release.py --version "$VERSION" --output dist --resume-run-id "$RESUME_RUN_ID"
          else
            python3 scripts/build_release.py --version "$VERSION" --output dist
          fi
      - name: Remove ephemeral signing state
        if: always()
        run: |
          KEYCHAIN="$RUNNER_TEMP/nightr-signing.keychain-db"
          if test -e "$KEYCHAIN"; then
            security delete-keychain "$KEYCHAIN"
          fi
          test ! -e "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/notary.p8"
          test ! -e "$RUNNER_TEMP/signing.p12"
          test ! -e "$RUNNER_TEMP/notary.p8"
      - name: Accept signed package on this disposable runner
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python3 scripts/check_installer.py --disposable-github-runner --dmg "dist/Nightr-$VERSION-universal.dmg" --team-id "$NIGHTR_TEAM_ID" --version "$VERSION" --report dist/installer-acceptance.json
      - name: Retain candidate and acceptance evidence (never publish)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightr-${{ inputs.version }}-${{ github.sha }}-${{ github.run_id }}
          path: |
            dist/*.dmg
            dist/nightr-release.json
            dist/nightr.rb
            dist/installer-acceptance.json
          if-no-files-found: warn
          retention-days: 14
      - name: Retain exact signed notarization checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightr-checkpoint-${{ inputs.version }}-${{ github.sha }}-${{ github.run_id }}
          path: |
            dist/checkpoint/checkpoint.json
            dist/checkpoint/Nightr.zip
            dist/checkpoint/ai.nightr.installguard
            dist/checkpoint/Nightr.pkg
            dist/checkpoint/submitted.dmg
            dist/checkpoint/app-notary.log
            dist/checkpoint/package-notary.log
            dist/checkpoint/dmg-notary.log
          if-no-files-found: warn
          retention-days: 14
